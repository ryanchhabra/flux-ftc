// flux-runtime — the code that ships INSIDE the Robot Controller APK.
//
// This module is Java 8 only, no Kotlin (see CONTRACT.md "Language"). Reason: this library is
// compiled into the RC app itself (unlike TeamCode, which is hot-reloaded from a pushed dex), so
// anything it depends on becomes a permanent, un-reloadable part of every team's robot. Dragging
// in the Kotlin stdlib here would duplicate-define kotlin.* classes across every RC app that uses
// Flux, for zero benefit — the runtime itself has no need of Kotlin.
//
// FTC SDK dependencies are `compileOnly`: RobotCore/FtcCommon classes must come from the app that
// actually embeds flux-runtime (the FtcRobotController app already depends on them at the versions
// it ships), never bundled a second time. `implementation` here would duplicate SDK classes into
// the APK's dex under a second identity — precisely the class-identity hazard this whole project
// is built to avoid (see docs/research/risks.md §1-2). Using `compileOnly` means the classes are
// visible to javac but contribute nothing to the runtime artifact.

plugins {
    id 'com.android.library'
    id 'maven-publish'
}

// Must match flux-gradle's coordinates: the two halves speak one wire protocol (CONTRACT.md) and
// a version mismatch between them is exactly the skew that produces confusing robot-side failures.
group = 'dev.ryanchhab'
version = '0.1.0-alpha'

android {
    namespace 'dev.ryanchhab.flux.runtime'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Publish only the release variant. Sources are included because teams WILL end up reading
    // this code when a reload misbehaves -- the classloader logic is subtle, and the comments
    // explaining why it's shaped this way are most of its value.
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    // compileOnly: see the module-level comment above. The host RC app supplies these at runtime.
    compileOnly 'org.firstinspires.ftc:RobotCore:12.0.0'
    compileOnly 'org.firstinspires.ftc:FtcCommon:12.0.0'
}

publishing {
    publications {
        release(MavenPublication) {
            // afterEvaluate: the Android library's `release` software component does not exist
            // until AGP has finished configuring its variants.
            afterEvaluate { from components.release }

            artifactId = 'flux-runtime'

            pom {
                name = 'FTC Flux Runtime'
                description = 'On-robot runtime for FTC Flux hot code reload: classloaders, ' +
                        'reload engine, and live tuning. Ships inside the Robot Controller APK.'
                url = 'https://github.com/ryanchhabra/flux-ftc'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'ryanchhabra'
                        name = 'Ryan Chhabra'
                    }
                }
            }
        }
    }
    repositories {
        // A plain folder repository committed to the repo and served over raw GitHub. Teams add
        // one `maven { url ... }` line and then use normal coordinates and a normal plugins {}
        // block. See docs/design/distribution.md for why not JitPack: it forces
        // com.github.<user>.<repo> coordinates, which breaks the dev.ryanchhab.flux plugin marker.
        maven {
            name = 'repoFolder'
            url = uri("$rootDir/../maven")
        }
    }
}
